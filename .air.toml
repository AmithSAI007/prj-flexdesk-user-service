# .air.toml
# This is the configuration file for Air, a live-reloading tool for Go.

# The root directory of your project.
root = "."
# A temporary directory for build artifacts.
tmp_dir = "tmp"

[build]
# The command to build your application. This points to your main package.
cmd = "go build -o ./tmp/main ./cmd/api"
# The binary that Air will execute after a successful build.
bin = "tmp/main"

# A list of file extensions that Air should watch for changes.
# We've added .sql and .yaml for sqlc changes!
include_ext = ["go", "tpl", "tmpl", "html", "sql", "yaml"]

# Directories to ignore. 'tmp' is critical to prevent infinite loops.
exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs"]

# Log file for build errors.
log = "air_errors.log"

[log]
# Show timestamps in the log output.
time = true

[misc]
# Delete the tmp directory on exit for a clean shutdown.
clean_on_exit = true
